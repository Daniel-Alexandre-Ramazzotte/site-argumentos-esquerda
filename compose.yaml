name: brasil-em-perspectiva
services:
  web:
    build: .
    profiles: [site]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://brasil_reader:${DATABASE_READER_PASSWORD}@postgres:5432/${POSTGRES_DB:-brasil_perspectiva}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brasil_perspectiva}
      POSTGRES_USER: ${POSTGRES_USER:-brasil_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run db:setup}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
